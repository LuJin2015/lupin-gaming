<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Snake — Lupin Gaming</title>
<style>:root{color-scheme:dark;--bg:#0c0d16;--panel:#151725;--purple:#9c8cff;--cyan:#7be7dc;--muted:#a8acc4}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#37305e,transparent 55%),var(--bg);color:#f7f7ff;font:16px/1.5 system-ui,sans-serif;display:grid;place-items:center;padding:18px}.app{width:min(640px,100%)}a{color:var(--cyan);text-decoration:none}.top{display:flex;justify-content:space-between}.panel{margin-top:24px;padding:clamp(16px,4vw,30px);border:1px solid #2a2d43;background:#151725;border-radius:24px;text-align:center}h1{margin:8px 0;font-size:clamp(2rem,7vw,3rem);letter-spacing:-.05em}.muted{color:var(--muted)}canvas{width:min(100%,420px);aspect-ratio:1;background:#0a0c14;border:1px solid #30334c;border-radius:12px;display:block;margin:20px auto;image-rendering:pixelated}.row{display:flex;align-items:center;justify-content:center;gap:22px}.row strong{font-size:1.35rem}button{background:#24263d;color:white;border:1px solid #40435d;border-radius:11px;padding:10px 15px;font:inherit;font-weight:700;cursor:pointer}.controls{display:grid;grid-template-columns:repeat(3,48px);gap:6px;justify-content:center;margin-top:12px}.controls button{padding:8px}.controls .blank{visibility:hidden}.help{font-size:.83rem;color:var(--muted);margin-top:16px}</style><script src="https://raw.githubusercontent.com/LuJin2015/lupin-data/main/sdk/lupin-auth.js"></script>
</head>
<body><main class="app"><div class="top"><a href="../">← Lupin Gaming</a><span class="muted">CLASSIC / 002</span></div><section class="panel"><h1>Neon Snake 🐍</h1><p class="muted">Collect the cyan orbs. Don't hit the wall or yourself.</p><div class="row"><span>Score <strong id="score">0</strong></span><span>Best <strong id="best">0</strong></span></div><canvas id="board" width="400" height="400" aria-label="Snake game board"></canvas><div><button id="start">Start / Restart</button><button id="pause">Pause</button></div><div class="controls"><span class="blank">·</span><button data-dir="up" aria-label="Up">↑</button><span class="blank">·</span><button data-dir="left" aria-label="Left">←</button><button data-dir="down" aria-label="Down">↓</button><button data-dir="right" aria-label="Right">→</button></div><div class="help">Use arrow keys or WASD. On mobile, use the direction buttons.</div><div id="message" class="help">Press Start / Restart to play.</div></section></main>
<script>
const c=document.getElementById('board'),ctx=c.getContext('2d'),$=id=>document.getElementById(id),N=20,C=20,key='lupinGaming.snake.best.'+(window.LUPIN_AUTH?.session()?.user?.id||'guest');let snake,dir,next,food,score=0,best=Number(localStorage.getItem(key)||0),timer=null,running=false,paused=false;
$('best').textContent=best;
function randFood(){let p;do{p={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(s=>s.x===p.x&&s.y===p.y));return p}
function draw(){ctx.fillStyle='#0a0c14';ctx.fillRect(0,0,400,400);ctx.strokeStyle='#191c2b';for(let i=0;i<=N;i++){ctx.beginPath();ctx.moveTo(i*C,0);ctx.lineTo(i*C,400);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*C);ctx.lineTo(400,i*C);ctx.stroke()}if(food){ctx.fillStyle='#7be7dc';ctx.shadowColor='#7be7dc';ctx.shadowBlur=14;ctx.beginPath();ctx.arc(food.x*C+10,food.y*C+10,7,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}if(snake){snake.forEach((s,i)=>{ctx.fillStyle=i===0?'#c3b7ff':'#8270e8';ctx.fillRect(s.x*C+2,s.y*C+2,C-4,C-4)})}}
function paint(){ $('score').textContent=score;$('best').textContent=best;draw()}
function finish(msg){running=false;paused=false;clearInterval(timer);timer=null;$('message').textContent=msg;draw()}
function step(){if(!running||paused)return;dir=next;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};const ate=h.x===food.x&&h.y===food.y;if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some((s,i)=>i<(ate?snake.length:snake.length-1)&&s.x===h.x&&s.y===h.y)){finish('Game over! Press Start / Restart to try again.');return}snake.unshift(h);if(ate){score++;if(score>best){best=score;localStorage.setItem(key,String(best))}food=randFood()}else snake.pop();paint()}
function start(){clearInterval(timer);snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};next={x:1,y:0};score=0;food=randFood();running=true;paused=false;$('message').textContent='Go!';timer=setInterval(step,115);paint()}
function turn(d){if(!running)return;const map={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};const n=map[d];if(n.x!==-dir.x||n.y!==-dir.y)next=n}
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase(),m={arrowup:'up',w:'up',arrowdown:'down',s:'down',arrowleft:'left',a:'left',arrowright:'right',d:'right'};if(m[k]){e.preventDefault();turn(m[k])}});
document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>turn(b.dataset.dir)));
$('start').addEventListener('click',start);$('pause').addEventListener('click',()=>{if(!running)return;paused=!paused;$('pause').textContent=paused?'Resume':'Pause';$('message').textContent=paused?'Paused.':'Back in the game!'});
draw();
</script></body></html>
