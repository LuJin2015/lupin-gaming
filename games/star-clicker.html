<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Star Clicker — Lupin Gaming</title>
<style>:root{color-scheme:dark;--bg:#0c0d16;--panel:#17192a;--purple:#9c8cff;--cyan:#7be7dc;--muted:#a8acc4}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#37305e,transparent 55%),var(--bg);color:#f7f7ff;font:16px/1.5 system-ui,sans-serif;display:grid;place-items:center;padding:18px}.app{width:min(680px,100%)}a{color:var(--cyan);text-decoration:none}.top{display:flex;justify-content:space-between;gap:12px}.panel{text-align:center;margin-top:28px;padding:clamp(22px,6vw,48px);border:1px solid #2a2d43;background:#151725;border-radius:26px}h1{font-size:clamp(2rem,7vw,3.5rem);letter-spacing:-.06em;margin:8px 0}.muted{color:var(--muted)}.stats{display:flex;justify-content:center;gap:clamp(20px,7vw,54px);margin:26px 0}.stat strong{display:block;font-size:1.8rem}.star{width:150px;height:150px;border:0;border-radius:50%;background:linear-gradient(145deg,#c4b8ff,#8a76fa);font-size:4.5rem;cursor:pointer;box-shadow:0 0 55px #9c8cff55;transition:transform .08s}.star:active{transform:scale(.91)}button.action{border:1px solid #3b3e58;border-radius:12px;background:#22243a;color:white;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer;margin:7px}button:disabled{opacity:.45;cursor:not-allowed}.message{min-height:28px;margin:16px 0;color:var(--cyan)}.note{font-size:.82rem;color:var(--muted);margin-top:24px}</style></head>
<body><main class="app"><div class="top"><a href="../">← Lupin Gaming</a><span class="muted">ARCADE / 001</span></div><section class="panel"><div class="muted">THE 15-SECOND CHALLENGE</div><h1>Star Clicker ✨</h1><p class="muted">Click the star as many times as you can before the timer ends.</p><div class="stats"><div class="stat"><span class="muted">Score</span><strong id="score">0</strong></div><div class="stat"><span class="muted">Time</span><strong id="time">15</strong></div><div class="stat"><span class="muted">Best</span><strong id="best">0</strong></div></div><button class="star" id="star" aria-label="Collect star" disabled>✦</button><div class="message" id="message">Press Start to begin!</div><div><button class="action" id="start">Start game</button><button class="action" id="reset">Reset</button></div><div class="note">Tip: every click counts. Your personal best is saved on this device.</div></section></main>
<script>
const $=id=>document.getElementById(id);let score=0,time=15,timer=null,playing=false;const key='lupinGaming.starClicker.best';let best=Number(localStorage.getItem(key)||0);$('best').textContent=best;
function paint(){$('score').textContent=score;$('time').textContent=time;$('best').textContent=best}
function end(){playing=false;clearInterval(timer);timer=null;$('star').disabled=true;$('start').disabled=false;$('start').textContent='Play again';$('message').textContent=score>best?'New personal best! Brilliant clicking!':'Time! Can you beat that score?';if(score>best){best=score;localStorage.setItem(key,String(best));paint()}}
$('start').addEventListener('click',()=>{if(playing)return;score=0;time=15;playing=true;$('star').disabled=false;$('start').disabled=true;$('message').textContent='Go go go!';paint();timer=setInterval(()=>{time--;paint();if(time<=0)end()},1000)});
$('star').addEventListener('click',()=>{if(!playing)return;score++;$('message').textContent=score%10===0?'Combo! '+score+' stars!':'Keep going…';paint()});
$('reset').addEventListener('click',()=>{clearInterval(timer);timer=null;playing=false;score=0;time=15;$('star').disabled=true;$('start').disabled=false;$('start').textContent='Start game';$('message').textContent='Ready for another round?';paint()});
document.addEventListener('keydown',e=>{if(e.key===' '&&playing){e.preventDefault();$('star').click()}});
</script></body></html>
